name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: shopsense, POSTGRES_PASSWORD: shopsense, POSTGRES_DB: shopsense_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopsense" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://shopsense:shopsense@localhost:5432/shopsense_test
      DATABASE_URL: postgresql://shopsense:shopsense@localhost:5432/shopsense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: shopsense, POSTGRES_PASSWORD: shopsense, POSTGRES_DB: shopsense_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopsense" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://shopsense:shopsense@localhost:5432/shopsense_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync -p 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:20601
          API_INTERNAL_URL: http://localhost:20699

  docker:
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Boot stack and smoke test
        run: |
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://localhost:20601/health
          curl -fsS "http://localhost:20601/api/v1/search?q=running%20shoes" | head -c 300
          curl -fsS -o /dev/null http://localhost:20600/
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
